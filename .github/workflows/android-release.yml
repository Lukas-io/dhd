name: Android APK release

on:
  push:
    tags:
      - "dhd-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/dhd-android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build APK
        working-directory: apps/dhd-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cp apps/dhd-android/app/build/outputs/apk/debug/app-debug.apk "DHD-${RELEASE_TAG}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DHD ${{ github.ref_name }}
          generate_release_notes: true
          files: DHD-${{ github.ref_name }}.apk
