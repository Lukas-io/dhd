name: Android APK release

on:
  push:
    branches:
      - master
    tags:
      - "dhd-v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/dhd-v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # Only a merged PR's exact merge commit gets an automatic release.
            for attempt in 1 2 3 4; do
              pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                | jq -r --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.merged_at != null and .base.ref == "master" and .merge_commit_sha == $sha) | .number] | first // empty')"
              if [[ -n "$pr_number" ]]; then break; fi
              if [[ "$attempt" -lt 4 ]]; then sleep 5; fi
            done
            if [[ -z "$pr_number" ]]; then
              echo "No merged PR at ${GITHUB_SHA}; skipping release."
              exit 0
            fi

            version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              apps/dhd-android/app/build.gradle.kts | head -n 1)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Expected a literal semantic versionName in apps/dhd-android/app/build.gradle.kts"
              exit 1
            fi

            tag="dhd-v${version}-pr${pr_number}"
            existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag ${tag} already points to another commit"
              exit 1
            fi
            if [[ -z "$existing" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" "$GITHUB_SHA" -m "DHD ${version} from PR #${pr_number}"
              git push origin "refs/tags/${tag}"
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.release.outputs.tag != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/dhd-android/**/*.gradle*

      - name: Set up Android SDK
        if: steps.release.outputs.tag != ''
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        if: steps.release.outputs.tag != ''
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build APK
        if: steps.release.outputs.tag != ''
        working-directory: apps/dhd-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare release APK
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: cp apps/dhd-android/app/build/outputs/apk/debug/app-debug.apk "DHD-${RELEASE_TAG}.apk"

      - name: Publish GitHub release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: DHD ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: DHD-${{ steps.release.outputs.tag }}.apk
